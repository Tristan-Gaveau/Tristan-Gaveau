<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sweep {
        animation: sweep 6s linear infinite;
        transform-origin: 165px 140px;
      }
      @keyframes sweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .ping1 { animation: ping 3.0s ease-in-out infinite; }
      .ping2 { animation: ping 3.0s ease-in-out 1.5s infinite; }
      @keyframes ping {
        0%,100% { opacity: 0.2; }
        50%      { opacity: 1.0; }
      }
      .statusdot { animation: ping 2s ease-in-out infinite; }
    </style>
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#0c1626" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#112240" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0d1a30" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipL">
      <circle cx="165" cy="140" r="116"/>
    </clipPath>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1000" height="280" fill="#070b16"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- ═══ LEFT RADAR ═══ -->
  <circle cx="165" cy="140" r="116" fill="url(#glowL)"/>

  <g fill="none" stroke="#12243e">
    <circle cx="165" cy="140" r="116" stroke-width="1.0"/>
    <circle cx="165" cy="140" r="90"  stroke-width="0.8"/>
    <circle cx="165" cy="140" r="64"  stroke-width="0.7"/>
    <circle cx="165" cy="140" r="38"  stroke-width="0.6"/>
    <circle cx="165" cy="140" r="14"  stroke-width="0.5"/>
  </g>

  <!-- crosshairs -->
  <line x1="49"  y1="140" x2="281" y2="140" stroke="#12243e" stroke-width="0.7"/>
  <line x1="165" y1="24"  x2="165" y2="256" stroke="#12243e" stroke-width="0.7"/>
  <!-- 45° ticks -->
  <g stroke="#12243e" stroke-width="0.6">
    <line x1="83"  y1="58"  x2="91"  y2="66"/>
    <line x1="247" y1="58"  x2="239" y2="66"/>
    <line x1="83"  y1="222" x2="91"  y2="214"/>
    <line x1="247" y1="222" x2="239" y2="214"/>
  </g>

  <!-- radar sweep -->
  <g clip-path="url(#clipL)">
    <g class="sweep">
      <path d="M 165 140 L 281 140 A 116 116 0 0 0 247 58 Z" fill="#152c5a" opacity="0.18"/>
      <line x1="165" y1="140" x2="281" y2="140" stroke="#2a5aaa" stroke-width="1.8" opacity="0.9"/>
    </g>
  </g>

  <!-- target pings -->
  <circle class="ping1" cx="208" cy="78"  r="2.8" fill="#4a80c8"/>
  <circle class="ping2" cx="128" cy="178" r="2.0" fill="#4a80c8"/>
  <circle cx="192" cy="162" r="1.5" fill="#4a80c8" opacity="0.35"/>

  <!-- center dot -->
  <circle cx="165" cy="140" r="4" fill="#1a3870"/>
  <circle cx="165" cy="140" r="2" fill="#3a68b8"/>

  <!-- ═══ CENTER TEXT BLOCK ═══ -->
  <line x1="300" y1="88"  x2="700" y2="88"  stroke="#15284a" stroke-width="0.9"/>
  <line x1="300" y1="192" x2="700" y2="192" stroke="#15284a" stroke-width="0.9"/>

  <!-- corner brackets -->
  <path d="M 310 100 L 310 90 L 320 90"  stroke="#1e3a62" stroke-width="1.6" fill="none"/>
  <path d="M 690 100 L 690 90 L 680 90"  stroke="#1e3a62" stroke-width="1.6" fill="none"/>
  <path d="M 310 180 L 310 190 L 320 190" stroke="#1e3a62" stroke-width="1.6" fill="none"/>
  <path d="M 690 180 L 690 190 L 680 190" stroke="#1e3a62" stroke-width="1.6" fill="none"/>

  <!-- header label -->
  <text x="500" y="80"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#2a4870" text-anchor="middle" letter-spacing="5">
      PORTFOLIO  
  </text>

  <!-- main name -->
  <text x="500" y="148"
        font-family="'Courier New', Courier, monospace"
        font-size="38" fill="#c5d4e8" text-anchor="middle"
        font-weight="bold" letter-spacing="10">
    TRISTAN GAVEAU
  </text>

  <!-- subtitle -->
  <text x="500" y="178"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#385572" text-anchor="middle" letter-spacing="5">
    AERONAUTIQUE  ·  DEFENSE  ·  SYSTEMES
  </text>

  <!-- ═══ RIGHT RETICLE ═══ -->
  <circle cx="835" cy="140" r="116" fill="url(#glowR)"/>

  <g fill="none" stroke="#12243e">
    <circle cx="835" cy="140" r="116" stroke-width="1.0"/>
    <circle cx="835" cy="140" r="90"  stroke-width="0.8"/>
    <circle cx="835" cy="140" r="62"  stroke-width="0.6"/>
  </g>

  <!-- partial bright arcs (targeting style) -->
  <path d="M 835 24  A 116 116 0 0 1 951 140" stroke="#1e3a6a" stroke-width="1.6" fill="none"/>
  <path d="M 719 140 A 116 116 0 0 1 835 256" stroke="#1e3a6a" stroke-width="1.6" fill="none"/>

  <!-- crosshairs -->
  <line x1="719" y1="140" x2="951" y2="140" stroke="#12243e" stroke-width="0.7"/>
  <line x1="835" y1="24"  x2="835" y2="256" stroke="#12243e" stroke-width="0.7"/>

  <!-- targeting marks (H-bars) -->
  <g stroke="#2050a0" stroke-width="1.0" opacity="0.85">
    <line x1="890" y1="134" x2="903" y2="134"/>
    <line x1="890" y1="146" x2="903" y2="146"/>
    <line x1="767" y1="134" x2="780" y2="134"/>
    <line x1="767" y1="146" x2="780" y2="146"/>
  </g>

  <!-- aircraft silhouette (top-down delta-wing fighter) -->
  <g transform="translate(835,140)" fill="#b0c4da" opacity="0.80">
    <!-- fuselage -->
    <path d="M 0,-22 C 2.5,-14 3,-5 3,6 L 3,21 L 0,18 L -3,21 L -3,6 C -3,-5 -2.5,-14 0,-22 Z"/>
    <!-- left delta wing -->
    <path d="M -2.5,0 L -26,17 L -19,11 L -2.5,8 Z"/>
    <!-- right delta wing -->
    <path d="M 2.5,0  L 26,17  L 19,11  L 2.5,8  Z"/>
    <!-- left tailfin -->
    <path d="M -2,14 L -11,21 L -8,21 L -2,16 Z"/>
    <!-- right tailfin -->
    <path d="M 2,14  L 11,21  L 8,21  L 2,16  Z"/>
  </g>

  <!-- right center -->
  <circle cx="835" cy="140" r="4" fill="#1a3060"/>
  <circle cx="835" cy="140" r="2" fill="#2a5090"/>

  <!-- ═══ STATUS BAR ═══ -->
  <rect x="0" y="256" width="1000" height="24" fill="#05080e"/>
  <line x1="0" y1="256" x2="1000" y2="256" stroke="#101e34" stroke-width="0.9"/>

  <circle class="statusdot" cx="20" cy="268" r="3.5" fill="#2a5aaa"/>
  <text x="34" y="272"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#2a4262" letter-spacing="1">
    SYS: ONLINE
  </text>
  <text x="500" y="272"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#2a4262" text-anchor="middle" letter-spacing="2">
    ESILV  ·  PARIS, FRANCE
  </text>
  <text x="980" y="272"
        font-family="'Courier New', Courier, monospace"
        font-size="9" fill="#2a4262" text-anchor="end" letter-spacing="1">
    2026
  </text>
</svg>
